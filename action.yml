name: Bynk CI
description: >-
  Run the standard Bynk quality gate — format check, type check, and tests.
author: bynk-lang

branding:
  icon: check-circle
  color: purple

inputs:
  version:
    description: Bynk version to install (passed to setup-bynk).
    required: false
    default: latest
  version-file:
    description: >-
      A file holding the exact Bynk version to install, such as the
      repository's BYNK_VERSION, relative to the workspace. Use this or
      version, not both.
    required: false
    default: ""
  repository:
    description: The owner/name repo that publishes Bynk releases.
    required: false
    default: bynk-lang/bynk
  working-directory:
    description: Directory to run the checks in.
    required: false
    default: "."
  source:
    description: Source path passed to bynkc (file or directory).
    required: false
    default: src
  format:
    description: Run `bynkc fmt --check`.
    required: false
    default: "true"
  check:
    description: Run `bynkc check --format short`.
    required: false
    default: "true"
  test:
    description: Run `bynkc test`.
    required: false
    default: "true"
  github-token:
    description: Token for setup-bynk's API calls.
    required: false
    default: ${{ github.token }}

runs:
  using: composite
  steps:
    # Read here rather than by setup-bynk, so this works whichever setup-bynk
    # v1 is current. The same rules as setup-bynk's version-file.
    - name: Resolve the version input
      id: version
      shell: bash
      env:
        INPUT_VERSION: ${{ inputs.version }}
        INPUT_VERSION_FILE: ${{ inputs.version-file }}
      run: |
        set -euo pipefail
        want="${INPUT_VERSION:-latest}"
        file="$INPUT_VERSION_FILE"
        if [ -n "$file" ]; then
          die() { echo "::error::bynk-ci: $*" >&2; exit 1; }
          [ "$want" = latest ] || die "set version or version-file, not both"
          [ -f "$file" ] || die "version-file $file does not exist"
          want="$(tr -d '[:space:]' < "$file")"
          [[ "$want" =~ ^v?[0-9]+\.[0-9]+\.[0-9]+([-+][0-9A-Za-z.-]+)?$ ]] \
            || die "version-file $file must hold an exact version such as 0.404.0, not '$want'"
        fi
        echo "version=$want" >> "$GITHUB_OUTPUT"

    - name: Install Bynk
      uses: bynk-lang/setup-bynk@v1
      with:
        version: ${{ steps.version.outputs.version }}
        repository: ${{ inputs.repository }}
        github-token: ${{ inputs.github-token }}

    - name: Enable Bynk problem matcher
      shell: bash
      run: echo "::add-matcher::${{ github.action_path }}/bynk-problem-matcher.json"

    - name: Format check
      if: inputs.format == 'true'
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: bynkc fmt --check ${{ inputs.source }}

    # Run from the repository root on <working-directory>/<source>, so each
    # diagnostic names its file relative to the repository and the problem
    # matcher annotates the right file. Needs Bynk 0.309.3 or later, which
    # reports paths as typed from the working directory (bynk-lang/bynk#1772).
    - name: Type check
      if: inputs.check == 'true'
      shell: bash
      env:
        INPUT_WORKING_DIRECTORY: ${{ inputs.working-directory }}
        INPUT_SOURCE: ${{ inputs.source }}
      run: |
        dir="${INPUT_WORKING_DIRECTORY%/}"
        case "$INPUT_SOURCE" in
          /*) path="$INPUT_SOURCE" ;;
          *)
            if [ -z "$dir" ] || [ "$dir" = . ]; then path="$INPUT_SOURCE"
            elif [ "$INPUT_SOURCE" = . ]; then path="$dir"
            else path="$dir/$INPUT_SOURCE"
            fi ;;
        esac
        bynkc check --format short "$path"

    - name: Test
      if: inputs.test == 'true'
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: bynkc test ${{ inputs.source }}

    - name: Disable Bynk problem matcher
      if: always()
      shell: bash
      run: echo "::remove-matcher owner=bynk::"
