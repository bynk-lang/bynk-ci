# Bynk canary: re-run this action against a new Bynk release, and keep a
# `canary` issue open while it fails.
#
# Triggered by the org dispatcher in bynk-lang/.github (on each Bynk release,
# and weekly), which is why there is no `schedule` here. This repository is
# listed in bynk-lang/.github's canary/repos.json, and the canary GitHub App is
# installed on it. See https://github.com/bynk-lang/.github/blob/main/canary/README.md
#
# Two things run at the dispatched version:
# - `tests`: test.yml, this repository's own tests (`uses: ./`): every check
#   passes a clean project, fails the fixture it should, and its output still
#   parses with the problem matcher.
# - `canary`: the released bynk-ci@v1 on the clean fixture, the way users run it.
# `tests`' result is passed in as `upstream-result`, so a break in either
# opens or updates the one `canary` issue.
name: Bynk canary

on:
  repository_dispatch:
    types: [bynk-canary]
  workflow_dispatch:
    inputs:
      version:
        description: Bynk version, exact ("0.307.0") or "latest"
        type: string
        default: latest

permissions:
  contents: read
  issues: write
  actions: read   # test.yml reads its own run's annotations
  checks: read
  id-token: write   # canary.yml reports with the run's GitHub OIDC token

jobs:
  tests:
    name: Tests
    uses: ./.github/workflows/test.yml
    with:
      version: ${{ github.event.client_payload.version || inputs.version || 'latest' }}

  canary:
    name: Canary
    needs: tests
    if: ${{ !cancelled() }}
    uses: bynk-lang/.github/.github/workflows/canary.yml@v1
    with:
      version: ${{ github.event.client_payload.version || inputs.version || 'latest' }}
      upstream-result: ${{ needs.tests.result }}
      kind: action
      working-directory: test/fixtures/good
      source: .
