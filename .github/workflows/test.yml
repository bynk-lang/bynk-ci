name: Test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      version:
        description: Bynk version to test, exact or "latest" (empty for BYNK_VERSION)
        type: string
        default: ""
  # bynk-canary.yml calls this at each new Bynk release.
  workflow_call:
    inputs:
      version:
        description: Bynk version to test, exact or "latest" (empty for BYNK_VERSION)
        type: string
        default: ""

permissions:
  contents: read

# Push and pull_request runs use the version in BYNK_VERSION, so a red build
# means the change broke something, not that a new compiler came out. The
# canary proposes moving it once a newer release passes.
#
# Each fixture under test/fixtures fails exactly one check:
#   good          passes fmt, check and test (src/ + tests/)
#   unformatted   fails fmt only
#   type-error    fails check (and so test)
#   failing-test  fails test only
env:
  REQUESTED: ${{ inputs.version }}

jobs:
  pass:
    name: A clean project passes (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Choose the Bynk version
        shell: bash
        run: echo "BYNK_VERSION=${REQUESTED:-$(tr -d '[:space:]' < BYNK_VERSION)}" >> "$GITHUB_ENV"

      # The project root as `source`: fmt, check and test all see src/ and tests/.
      - name: bynk-ci on the project root
        uses: ./
        with:
          version: ${{ env.BYNK_VERSION }}
          working-directory: test/fixtures/good
          source: .

      # The action's default `source`, a directory under the project.
      - name: bynk-ci with source src
        uses: ./
        with:
          version: ${{ env.BYNK_VERSION }}
          working-directory: test/fixtures/good
          source: src

      # A `source` with a space is one path, not two arguments (bynk-ci#47).
      # The copy is untracked, so the next step doesn't see it.
      - name: A source directory with a space in its name
        shell: bash
        run: cp -R test/fixtures/good/src "test/fixtures/good/src with space"

      - name: bynk-ci with a source containing a space
        uses: ./
        with:
          version: ${{ env.BYNK_VERSION }}
          working-directory: test/fixtures/good
          source: src with space

      - name: The checks left nothing tracked behind
        shell: bash
        run: git diff --exit-code -- test/fixtures

  refuse:
    name: Each check fails what it should
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Choose the Bynk version
        shell: bash
        run: echo "BYNK_VERSION=${REQUESTED:-$(tr -d '[:space:]' < BYNK_VERSION)}" >> "$GITHUB_ENV"


      - name: Unformatted
        id: unformatted
        continue-on-error: true
        uses: ./
        with:
          version: ${{ env.BYNK_VERSION }}
          working-directory: test/fixtures/unformatted
          source: .

      - name: Unformatted, format check off
        id: unformatted-no-format
        continue-on-error: true
        uses: ./
        with:
          version: ${{ env.BYNK_VERSION }}
          working-directory: test/fixtures/unformatted
          source: .
          format: "false"

      - name: Type error
        id: type-error
        continue-on-error: true
        uses: ./
        with:
          version: ${{ env.BYNK_VERSION }}
          working-directory: test/fixtures/type-error
          source: .
          test: "false"

      - name: Type error, only the format check
        id: type-error-format-only
        continue-on-error: true
        uses: ./
        with:
          version: ${{ env.BYNK_VERSION }}
          working-directory: test/fixtures/type-error
          source: .
          check: "false"
          test: "false"

      - name: Type error, source src
        id: type-error-src
        continue-on-error: true
        uses: ./
        with:
          version: ${{ env.BYNK_VERSION }}
          working-directory: test/fixtures/type-error
          source: src
          format: "false"
          test: "false"

      - name: Failing test
        id: failing-test
        continue-on-error: true
        uses: ./
        with:
          version: ${{ env.BYNK_VERSION }}
          working-directory: test/fixtures/failing-test
          source: .

      - name: Failing test, tests off
        id: failing-test-no-test
        continue-on-error: true
        uses: ./
        with:
          version: ${{ env.BYNK_VERSION }}
          working-directory: test/fixtures/failing-test
          source: .
          test: "false"

      - name: Assert the outcomes
        shell: bash
        env:
          UNFORMATTED: ${{ steps.unformatted.outcome }}
          UNFORMATTED_NO_FORMAT: ${{ steps.unformatted-no-format.outcome }}
          TYPE_ERROR: ${{ steps.type-error.outcome }}
          TYPE_ERROR_FORMAT_ONLY: ${{ steps.type-error-format-only.outcome }}
          TYPE_ERROR_SRC: ${{ steps.type-error-src.outcome }}
          FAILING_TEST: ${{ steps.failing-test.outcome }}
          FAILING_TEST_NO_TEST: ${{ steps.failing-test-no-test.outcome }}
        run: |
          failed=0
          expect() { # <what> <got> <want>
            if [ "$2" = "$3" ]; then echo "ok: $1 = $2"
            else echo "::error::$1 was '$2', expected '$3'"; failed=1; fi
          }
          expect "unformatted" "$UNFORMATTED" failure
          expect "unformatted, format: false" "$UNFORMATTED_NO_FORMAT" success
          expect "type error" "$TYPE_ERROR" failure
          expect "type error, format check only" "$TYPE_ERROR_FORMAT_ONLY" success
          expect "type error, source src" "$TYPE_ERROR_SRC" failure
          expect "failing test" "$FAILING_TEST" failure
          expect "failing test, test: false" "$FAILING_TEST_NO_TEST" success
          exit "$failed"

      # bynk is on PATH from the steps above. The annotations depend on
      # `bynk check --format short` matching the problem matcher's regexp, and
      # on its path being the file as typed from the working directory. Run from
      # the repository root, as the action does.
      - name: The problem matcher parses a diagnostic
        shell: bash
        run: |
          # The check is meant to fail here; it's the output that's under test.
          out="$(bynk check --format short test/fixtures/type-error 2>&1)" || true
          echo "$out"
          MATCHER="$GITHUB_WORKSPACE/bynk-problem-matcher.json" OUT="$out" node -e '
            const m = require(process.env.MATCHER).problemMatcher[0].pattern[0];
            const re = new RegExp(m.regexp);
            const hit = process.env.OUT.split("\n").map(l => l.match(re)).find(Boolean);
            if (!hit) { console.log("::error::no line of bynk check output matches the problem matcher"); process.exit(1); }
            const got = { file: hit[m.file], line: hit[m.line], column: hit[m.column],
                          severity: hit[m.severity], code: hit[m.code] };
            const want = { file: "test/fixtures/type-error/src/greeting.bynk", line: "7", column: "2",
                           severity: "error", code: "bynk.types.return_mismatch" };
            console.log(JSON.stringify(got));
            for (const k of Object.keys(want)) {
              if (got[k] !== want[k]) { console.log(`::error::matcher ${k} is ${got[k]}, expected ${want[k]}`); process.exitCode = 1; }
            }
          '

  # A crafted `source` is one literal path to bynk, never shell (bynk-ci#47).
  # The path exists, a copy of good/src named after the payload, so the action
  # must pass: a pass shows bynk ran on that path, and no marker file shows
  # the payload didn't run. Linux only, where `$` and `;` are valid in a name;
  # no `/`, so the markers are relative, in the working directory. A job of its own, so it adds nothing to the annotations the
  # annotations job reads from the refuse job.
  injection:
    name: A source is never run as shell
    runs-on: ubuntu-latest
    env:
      PAYLOAD: 'src $(touch injected-substitution); touch injected-semicolon'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Choose the Bynk version
        shell: bash
        run: echo "BYNK_VERSION=${REQUESTED:-$(tr -d '[:space:]' < BYNK_VERSION)}" >> "$GITHUB_ENV"

      - name: A source directory named after the payload
        shell: bash
        run: cp -R test/fixtures/good/src "test/fixtures/good/$PAYLOAD"

      - name: bynk-ci with the payload as source
        uses: ./
        with:
          version: ${{ env.BYNK_VERSION }}
          working-directory: test/fixtures/good
          source: ${{ env.PAYLOAD }}

      - name: The payload did not run
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          failed=0
          for f in injected-substitution injected-semicolon; do
            if [ -e "test/fixtures/good/$f" ]; then
              echo "::error::a source containing shell ran it: test/fixtures/good/$f exists"; failed=1
            else echo "ok: shell in source did not run ($f)"; fi
          done
          exit "$failed"

  # An empty source, as from an unset `vars.` value, fails before Bynk is
  # installed rather than handing bynk an empty path. Its own job, so the
  # refuse job's annotations stay as the annotations job expects.
  empty-source:
    name: An empty source fails early
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Choose the Bynk version
        shell: bash
        run: echo "BYNK_VERSION=${REQUESTED:-$(tr -d '[:space:]' < BYNK_VERSION)}" >> "$GITHUB_ENV"

      - name: bynk-ci with an empty source
        id: empty
        continue-on-error: true
        uses: ./
        with:
          version: ${{ env.BYNK_VERSION }}
          working-directory: test/fixtures/good
          source: ""

      # Before the next case, which installs Bynk.
      - name: Assert it failed before installing Bynk
        shell: bash
        env:
          EMPTY: ${{ steps.empty.outcome }}
        run: |
          failed=0
          if [ "$EMPTY" = failure ]; then echo "ok: an empty source = failure"
          else echo "::error::an empty source was '$EMPTY', expected 'failure'"; failed=1; fi
          # Bynk isn't on the runner image, so finding it means the action got
          # past the source check to the install step.
          if command -v bynk >/dev/null; then
            echo "::error::Bynk was installed, so the empty source didn't stop the action early"; failed=1
          else echo "ok: the action stopped before installing Bynk"; fi
          exit "$failed"

      # With every check off nothing uses source, so an empty one is fine.
      - name: bynk-ci with an empty source and every check off
        id: empty-all-off
        continue-on-error: true
        uses: ./
        with:
          version: ${{ env.BYNK_VERSION }}
          working-directory: test/fixtures/good
          source: ""
          format: "false"
          check: "false"
          test: "false"

      - name: Assert every check off passes
        shell: bash
        env:
          ALL_OFF: ${{ steps.empty-all-off.outcome }}
        run: |
          if [ "$ALL_OFF" = success ]; then echo "ok: an empty source, every check off = success"
          else echo "::error::an empty source with every check off was '$ALL_OFF', expected 'success'"; exit 1; fi

  # End to end: the annotations GitHub recorded on the refuse job, for the type
  # error the action checked with `source: .` and with `source: src`, must name
  # the file relative to the repository, so they land on the right line of a PR.
  annotations:
    name: Annotations name the right file
    needs: refuse
    # Whenever the refuse job ran, pass or fail: its annotations are what's
    # under test here, and a path regression fails the matcher test there too.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    permissions:
      actions: read
      checks: read
    steps:
      - name: Assert on the refuse job's annotations
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          ATTEMPT: ${{ github.run_attempt }}
        run: |
          set -euo pipefail
          # "Re-run failed jobs" carries a job that passed over from the
          # earlier attempt without listing it in the new one, so when this
          # attempt has no completed refuse job, walk back through the earlier
          # attempts and take the most recent one where it completed.
          job=""
          for (( try = ATTEMPT; try >= 1; try-- )); do
            job="$(gh api "repos/$REPO/actions/runs/$RUN_ID/attempts/$try/jobs" --paginate \
              --jq '.jobs[] | select(.status == "completed" and (.name | endswith("Each check fails what it should"))) | .id' | head -n1)"
            if [ -n "$job" ]; then
              [ "$try" -eq "$ATTEMPT" ] || echo "Using the refuse job from attempt $try"
              break
            fi
          done
          [ -n "$job" ] || { echo "::error::could not find a completed refuse job in attempts $ATTEMPT to 1 of this run"; exit 1; }
          notes="$(gh api "repos/$REPO/check-runs/$job/annotations" --paginate \
            --jq '.[] | select(.message | contains("return_mismatch") or contains("declared return type")) | "\(.path):\(.start_line)"')"
          echo "$notes"
          want="test/fixtures/type-error/src/greeting.bynk:7"
          [ -n "$notes" ] || { echo "::error::no annotation for the type error"; exit 1; }
          bad="$(grep -vxF "$want" <<<"$notes" || true)"
          if [ -n "$bad" ]; then
            echo "::error::type-error annotations on the wrong file: $(tr '\n' ' ' <<<"$bad")"; exit 1
          fi
          echo "All $(wc -l <<<"$notes") type-error annotations are on $want"

  # version-file reads the pin from a file (BYNK_VERSION here), by the same
  # rules as setup-bynk's: one exact version, and not together with version.
  version-file:
    name: The version comes from a file
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: A version file
        uses: ./
        with:
          version-file: BYNK_VERSION
          working-directory: test/fixtures/good
          source: .
          test: "false"

      - name: A version file and a version
        id: both
        continue-on-error: true
        uses: ./
        with:
          version: 0.404.0
          version-file: BYNK_VERSION
          working-directory: test/fixtures/good
          source: .

      - name: A version file that does not exist
        id: missing
        continue-on-error: true
        uses: ./
        with:
          version-file: NO_SUCH_FILE
          working-directory: test/fixtures/good
          source: .

      - name: Assert
        shell: bash
        env:
          BOTH: ${{ steps.both.outcome }}
          MISSING: ${{ steps.missing.outcome }}
        run: |
          failed=0
          want="bynk $(tr -d '[:space:]' < BYNK_VERSION)"; want="${want/bynk v/bynk }"
          got="$(bynk --version)"
          [ "$got" = "$want" ] || { echo "::error::installed '$got', BYNK_VERSION says '$want'"; failed=1; }
          [ "$BOTH" = failure ] || { echo "::error::version-file with version was '$BOTH', expected failure"; failed=1; }
          [ "$MISSING" = failure ] || { echo "::error::a missing version-file was '$MISSING', expected failure"; failed=1; }
          exit "$failed"
